# ============================================================


# ============================================================
# 01. FONT
# ============================================================

font_family         JetBrainsMono Nerd Font
font_size           12.0

# Ligatures
disable_ligatures   cursor

# Line spacing
adjust_line_height  1


# ============================================================
# 02. CURSOR
# ============================================================

cursor_shape                 beam

# Optional cursor movement animation
cursor_trail 2


# ============================================================
# 03. WINDOW
# ============================================================

# Internal padding
window_padding_width 10

# Transparency (not a color)
background_opacity 0.85


# ============================================================
# 05. TABS
# ============================================================

# Tab bar position
tab_bar_edge top

# Tab bar appearance
tab_bar_style powerline
tab_powerline_style round


# Tab title
tab_title_template "{index}: {title}"
tab_title_max_length 25


# ============================================================
# 06. SCROLLBACK
# ============================================================

# Number of lines stored in memory
scrollback_lines 1000


# ============================================================
# 07. MOUSE
# ============================================================

# Hide mouse cursor after inactivity
mouse_hide_wait 2.0


# ============================================================
# 09. SHELL INTEGRATION
# ============================================================

# Notify when long commands finish in hidden windows
notify_on_cmd_finish invisible 10.0


# ============================================================
# 10. BEHAVIOR
# ============================================================

# No confirmation when closing
confirm_os_window_close 0


# ============================================================
# 11. KEYBOARD SHORTCUTS
# ============================================================

# --- Clipboard ---

map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard


# --- Tabs ---

map ctrl+shift+t new_tab_with_cwd
map ctrl+shift+q close_tab

map ctrl+tab       next_tab
map ctrl+shift+tab previous_tab

# Direct tab switching
map ctrl+alt+1 goto_tab 1
map ctrl+alt+2 goto_tab 2
map ctrl+alt+3 goto_tab 3
map ctrl+alt+4 goto_tab 4
map ctrl+alt+5 goto_tab 5


# --- Windows ---

# New separate terminal window
map ctrl+shift+n new_os_window_with_cwd

# Close current split
map ctrl+shift+w close_window


# --- Vim-style window navigation ---

map ctrl+alt+h neighboring_window left
map ctrl+alt+j neighboring_window down
map ctrl+alt+k neighboring_window up
map ctrl+alt+l neighboring_window right


# --- Layouts ---

# Switch between layouts
map ctrl+shift+l next_layout


# --- Scrolling ---

map ctrl+shift+page_up scroll_page_up
map ctrl+shift+page_down scroll_page_down

# Browse terminal history
map ctrl+shift+h show_scrollback


# --- Configuration ---

# Edit kitty config
map ctrl+shift+f2 edit_config_file


# ============================================================
# 12. COLORS
# ============================================================

# Colors are managed by an external theme generator.
# No hardcoded colors here.
#
# Uncomment and change the path when your theme exists:
#
# include ${HOME}/.config/matugen/kitty-colors.conf


# ============================================================
# END
